<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kairos hero flythrough</title>
<style>
html, body { margin: 0; background: #060a11; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; background: radial-gradient(1200px 800px at 70% 20%, #0d1b2f 0%, #060a11 65%); }
canvas { position: absolute; inset: 0; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(3, 6, 12, 0.7) 100%); }
</style>
</head>
<body>
<div id="stage"><div id="vignette"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js" integrity="sha384-9EQoUIJYrv09/oYhSxnw1VpLcfPw3BM9dE7+D/3wGUPeLLa7F9Z6OAoD+i/M6FK9" crossorigin="anonymous"></script>
<script>
(function () {
    const DURATION = 16;
    const Q = new URLSearchParams(location.search);
    const VW = Number(Q.get('w')) || 1920, VH = Number(Q.get('h')) || 1080;
    const BAYS_X = 4, BAYS_Z = 3, BAY = 3.2, FLOORS = 7, FH = 2.4;
    const W = BAYS_X * BAY, D = BAYS_Z * BAY, H = FLOORS * FH;
    const gx = (i) => -W / 2 + i * BAY;
    const gz = (k) => -D / 2 + k * BAY;
    const storyStart = (s) => 1.4 + s * 1.25;
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

    const THREE_ = window.THREE;
    const cyan = new THREE_.Color(0x5bc8ff), amber = new THREE_.Color(0xff9b3d);
    const uniforms = {
        uTime: { value: 0 }, uFade: { value: 1 }, uScan: { value: -10 }, uPS: { value: VH / 1080 },
        uCyan: { value: new THREE_.Vector3(cyan.r, cyan.g, cyan.b) },
        uAmber: { value: new THREE_.Vector3(amber.r, amber.g, amber.b) }
    };

    const seg = { pos: [], anchor: [], time: [], kind: [], end: [] };
    const addSeg = (a, b, kind, t0, dur) => {
        seg.pos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        seg.anchor.push(a[0], a[1], a[2], a[0], a[1], a[2]);
        seg.time.push(t0, dur, t0, dur);
        seg.kind.push(kind, kind);
        seg.end.push(0, 1);
    };
    const nodes = { pos: [], time: [] };

    for (let i = 0; i <= BAYS_X; i++) for (let k = 0; k <= BAYS_Z; k++) nodes.pos.push(gx(i), 0, gz(k)), nodes.time.push(0.9 + rnd() * 0.5);
    for (let k = 0; k <= BAYS_Z; k++) addSeg([gx(0), 0, gz(k)], [gx(BAYS_X), 0, gz(k)], 0, 0.5 + rnd() * 0.5, 0.9);
    for (let i = 0; i <= BAYS_X; i++) addSeg([gx(i), 0, gz(0)], [gx(i), 0, gz(BAYS_Z)], 0, 0.6 + rnd() * 0.5, 0.9);

    for (let s = 0; s < FLOORS; s++) {
        const S = storyStart(s), y0 = s * FH, y1 = (s + 1) * FH;
        for (let i = 0; i <= BAYS_X; i++) for (let k = 0; k <= BAYS_Z; k++) {
            addSeg([gx(i), y0, gz(k)], [gx(i), y1, gz(k)], 0, S + rnd() * 0.3, 0.85);
            const r = 0.14;
            [[-r, -r], [r, -r], [r, r], [-r, r]].forEach(([dx, dz]) => addSeg([gx(i) + dx, y0 + 0.05, gz(k) + dz], [gx(i) + dx, y1, gz(k) + dz], 1, S + 0.25 + rnd() * 0.3, 0.9));
            for (let n = 0; n < 4; n++) {
                const y = y0 + 0.3 + n * 0.55, t = S + 0.3 + (n / 4) * 0.8;
                addSeg([gx(i) - r, y, gz(k) - r], [gx(i) + r, y, gz(k) - r], 1, t, 0.25);
                addSeg([gx(i) + r, y, gz(k) - r], [gx(i) + r, y, gz(k) + r], 1, t + 0.05, 0.25);
                addSeg([gx(i) + r, y, gz(k) + r], [gx(i) - r, y, gz(k) + r], 1, t + 0.1, 0.25);
                addSeg([gx(i) - r, y, gz(k) + r], [gx(i) - r, y, gz(k) - r], 1, t + 0.15, 0.25);
            }
            nodes.pos.push(gx(i), y1, gz(k)); nodes.time.push(S + 0.75 + rnd() * 0.4);
        }
        for (let k = 0; k <= BAYS_Z; k++) addSeg([gx(0), y1, gz(k)], [gx(BAYS_X), y1, gz(k)], 0, S + 0.55 + rnd() * 0.35, 0.75);
        for (let i = 0; i <= BAYS_X; i++) addSeg([gx(i), y1, gz(0)], [gx(i), y1, gz(BAYS_Z)], 0, S + 0.6 + rnd() * 0.35, 0.75);
        if (s % 2 === 0) for (let i = 0; i < BAYS_X; i += 2) {
            const t = S + 0.7;
            addSeg([gx(i), y0, gz(0)], [gx(i + 1), y1, gz(0)], 0, t, 0.8);
            addSeg([gx(i + 1), y0, gz(0)], [gx(i), y1, gz(0)], 0, t + 0.1, 0.8);
            addSeg([gx(i), y0, gz(BAYS_Z)], [gx(i + 1), y1, gz(BAYS_Z)], 0, t + 0.05, 0.8);
            addSeg([gx(i + 1), y0, gz(BAYS_Z)], [gx(i), y1, gz(BAYS_Z)], 0, t + 0.15, 0.8);
        }
    }

    const LINE_VERT = `
        attribute vec3 aAnchor; attribute vec2 aTime; attribute float aKind; attribute float aEnd;
        uniform float uTime;
        varying float vKind; varying float vEnd; varying float vProg; varying float vAge; varying float vY; varying float vDepth;
        void main() {
            float p = clamp((uTime - aTime.x) / aTime.y, 0.0, 1.0);
            float e = 1.0 - pow(1.0 - p, 3.0);
            vec3 pos = aAnchor + (position - aAnchor) * e;
            vProg = p; vEnd = aEnd; vKind = aKind; vY = pos.y;
            vAge = uTime - (aTime.x + aTime.y);
            vec4 mv = modelViewMatrix * vec4(pos, 1.0);
            vDepth = -mv.z;
            gl_Position = projectionMatrix * mv;
        }`;
    const LINE_FRAG = `
        uniform float uFade; uniform float uScan; uniform vec3 uCyan; uniform vec3 uAmber;
        varying float vKind; varying float vEnd; varying float vProg; varying float vAge; varying float vY; varying float vDepth;
        void main() {
            if (vProg <= 0.0) discard;
            float building = 1.0 - step(0.0, vAge);
            float settle = vAge > 0.0 ? clamp(1.0 - vAge / 0.9, 0.0, 1.0) : 1.0;
            float tip = mix(0.25, 1.0, smoothstep(0.2, 1.0, vEnd));
            float amberMix = settle * (building > 0.5 ? tip : 0.55);
            float d = uScan - vY;
            float flash = exp(-abs(d - 0.2) * 1.8) * step(-0.4, d) * step(d, 6.0);
            amberMix = max(amberMix, flash * 0.9);
            vec3 base = vKind > 0.5 ? vec3(0.55, 0.85, 1.0) : uCyan;
            vec3 col = mix(base, uAmber, clamp(amberMix, 0.0, 1.0));
            float a = vKind > 0.5 ? 0.6 : 0.88;
            a = max(a * (0.65 + 0.35 * settle), flash * 0.95);
            float fog = clamp(1.5 - vDepth / 120.0, 0.35, 1.0);
            gl_FragColor = vec4(col, a * fog * uFade);
        }`;
    const POINT_VERT = `
        attribute float aT;
        uniform float uTime; uniform float uPS;
        varying float vPop; varying float vDepth;
        void main() {
            vPop = clamp((uTime - aT) / 0.45, 0.0, 1.0);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vDepth = -mv.z;
            gl_PointSize = clamp(380.0 * uPS * (0.4 + 0.6 * vPop) / vDepth, 2.0 * uPS, 16.0 * uPS);
            gl_Position = projectionMatrix * mv;
        }`;
    const POINT_FRAG = `
        uniform float uFade; uniform vec3 uCyan; uniform vec3 uAmber;
        varying float vPop; varying float vDepth;
        void main() {
            float r = length(gl_PointCoord - 0.5);
            if (r > 0.5 || vPop <= 0.0) discard;
            vec3 col = mix(uAmber, uCyan, smoothstep(0.2, 1.0, vPop));
            float a = (1.0 - smoothstep(0.2, 0.5, r)) * 0.95;
            gl_FragColor = vec4(col, a * clamp(1.5 - vDepth / 120.0, 0.35, 1.0) * uFade);
        }`;
    const GROUND_VERT = `
        varying vec2 vXZ;
        void main() { vXZ = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const GROUND_FRAG = `
        uniform float uTime; uniform float uFade; uniform vec3 uCyan; uniform vec3 uAmber;
        varying vec2 vXZ;
        void main() {
            float len = length(vXZ);
            float base = (1.0 - smoothstep(8.0, 50.0, len)) * 0.26 * smoothstep(0.0, 1.2, uTime);
            float front = uTime * 14.0;
            float wave = exp(-pow((len - front) * 0.25, 2.0)) * (1.0 - smoothstep(2.5, 4.5, uTime));
            vec3 col = mix(uCyan, uAmber, clamp(wave, 0.0, 1.0));
            gl_FragColor = vec4(col, (base + wave * 0.7) * uFade);
        }`;
    const PANEL_VERT = `
        attribute float aT; attribute float aA;
        varying float vA; varying float vT; varying float vDepth;
        void main() {
            vA = aA; vT = aT;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vDepth = -mv.z;
            gl_Position = projectionMatrix * mv;
        }`;
    const PANEL_FRAG = `
        uniform float uTime; uniform float uFade; uniform vec3 uCyan;
        varying float vA; varying float vT; varying float vDepth;
        void main() {
            float on = smoothstep(vT, vT + 0.9, uTime);
            gl_FragColor = vec4(uCyan, vA * on * uFade * clamp(1.5 - vDepth / 120.0, 0.35, 1.0));
        }`;

    const mat = (v, f) => new THREE_.ShaderMaterial({ uniforms, vertexShader: v, fragmentShader: f, transparent: true, depthWrite: false, blending: THREE_.AdditiveBlending, side: THREE_.DoubleSide });
    const stage = document.getElementById('stage');
    stage.style.width = VW + 'px'; stage.style.height = VH + 'px';
    const renderer = new THREE_.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(VW, VH);
    renderer.setClearColor(0x000000, 0);
    stage.insertBefore(renderer.domElement, stage.firstChild);
    const scene = new THREE_.Scene();
    const camera = new THREE_.PerspectiveCamera(38, VW / VH, 0.1, 600);

    const lineGeo = new THREE_.BufferGeometry();
    lineGeo.setAttribute('position', new THREE_.Float32BufferAttribute(seg.pos, 3));
    lineGeo.setAttribute('aAnchor', new THREE_.Float32BufferAttribute(seg.anchor, 3));
    lineGeo.setAttribute('aTime', new THREE_.Float32BufferAttribute(seg.time, 2));
    lineGeo.setAttribute('aKind', new THREE_.Float32BufferAttribute(seg.kind, 1));
    lineGeo.setAttribute('aEnd', new THREE_.Float32BufferAttribute(seg.end, 1));
    const lines = new THREE_.LineSegments(lineGeo, mat(LINE_VERT, LINE_FRAG));
    lines.frustumCulled = false;
    scene.add(lines);

    const nodeGeo = new THREE_.BufferGeometry();
    nodeGeo.setAttribute('position', new THREE_.Float32BufferAttribute(nodes.pos, 3));
    nodeGeo.setAttribute('aT', new THREE_.Float32BufferAttribute(nodes.time, 1));
    const nodePts = new THREE_.Points(nodeGeo, mat(POINT_VERT, POINT_FRAG));
    nodePts.frustumCulled = false;
    scene.add(nodePts);

    const groundPos = [];
    for (let v = -60; v <= 60; v += BAY) groundPos.push(-60, 0, v, 60, 0, v, v, 0, -60, v, 0, 60);
    const groundGeo = new THREE_.BufferGeometry();
    groundGeo.setAttribute('position', new THREE_.Float32BufferAttribute(groundPos, 3));
    const ground = new THREE_.LineSegments(groundGeo, mat(GROUND_VERT, GROUND_FRAG));
    ground.frustumCulled = false;
    scene.add(ground);

    const panelPos = [], panelT = [], panelA = [];
    const quad = (a, b, c, d, t, al) => {
        [a, b, c, a, c, d].forEach((p) => { panelPos.push(p[0], p[1], p[2]); panelT.push(t); panelA.push(al); });
    };
    for (let s = 0; s < FLOORS; s++) {
        const y0 = s * FH, y1 = (s + 1) * FH;
        const faces = [];
        for (let i = 0; i < BAYS_X; i++) {
            faces.push([[gx(i), y0, gz(0)], [gx(i + 1), y0, gz(0)], [gx(i + 1), y1, gz(0)], [gx(i), y1, gz(0)]]);
            faces.push([[gx(i), y0, gz(BAYS_Z)], [gx(i + 1), y0, gz(BAYS_Z)], [gx(i + 1), y1, gz(BAYS_Z)], [gx(i), y1, gz(BAYS_Z)]]);
        }
        for (let k = 0; k < BAYS_Z; k++) {
            faces.push([[gx(0), y0, gz(k)], [gx(0), y0, gz(k + 1)], [gx(0), y1, gz(k + 1)], [gx(0), y1, gz(k)]]);
            faces.push([[gx(BAYS_X), y0, gz(k)], [gx(BAYS_X), y0, gz(k + 1)], [gx(BAYS_X), y1, gz(k + 1)], [gx(BAYS_X), y1, gz(k)]]);
        }
        faces.forEach((f) => quad(f[0], f[1], f[2], f[3], 8.6 + s * 0.14 + rnd() * 1.3, rnd() < 0.3 ? 0.11 : 0.025 + rnd() * 0.04));
    }
    for (let l = 1; l <= FLOORS; l++) {
        const y = l * FH, t = storyStart(l - 1) + 1.0;
        quad([gx(0), y, gz(0)], [gx(BAYS_X), y, gz(0)], [gx(BAYS_X), y, gz(BAYS_Z)], [gx(0), y, gz(BAYS_Z)], t, 0.07);
    }
    const panelGeo = new THREE_.BufferGeometry();
    panelGeo.setAttribute('position', new THREE_.Float32BufferAttribute(panelPos, 3));
    panelGeo.setAttribute('aT', new THREE_.Float32BufferAttribute(panelT, 1));
    panelGeo.setAttribute('aA', new THREE_.Float32BufferAttribute(panelA, 1));
    const panels = new THREE_.Mesh(panelGeo, mat(PANEL_VERT, PANEL_FRAG));
    panels.frustumCulled = false;
    scene.add(panels);

    const dustPos = [], dustT = [];
    for (let n = 0; n < 700; n++) { dustPos.push((rnd() - 0.5) * 100, rnd() * 34 - 2, (rnd() - 0.5) * 100); dustT.push(rnd() * 3); }
    const dustGeo = new THREE_.BufferGeometry();
    dustGeo.setAttribute('position', new THREE_.Float32BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('aT', new THREE_.Float32BufferAttribute(dustT, 1));
    const dust = new THREE_.Points(dustGeo, new THREE_.ShaderMaterial({
        uniforms, transparent: true, depthWrite: false, blending: THREE_.AdditiveBlending,
        vertexShader: `
            attribute float aT; uniform float uTime; uniform float uPS; varying float vTw;
            void main() {
                vec3 p = position + vec3(sin(uTime * 0.25 + aT * 6.0) * 1.2, uTime * 0.35 * (0.4 + aT * 0.3), cos(uTime * 0.2 + aT * 5.0) * 1.2);
                p.y = mod(p.y + 2.0, 34.0) - 2.0;
                vTw = 0.5 + 0.5 * sin(uTime * 1.5 + aT * 20.0);
                vec4 mv = modelViewMatrix * vec4(p, 1.0);
                gl_PointSize = clamp(90.0 * uPS / -mv.z, uPS, 3.2 * uPS);
                gl_Position = projectionMatrix * mv;
            }`,
        fragmentShader: `
            uniform float uFade; uniform vec3 uCyan; varying float vTw;
            void main() {
                float r = length(gl_PointCoord - 0.5);
                if (r > 0.5) discard;
                gl_FragColor = vec4(uCyan, (0.12 + 0.3 * vTw) * (1.0 - r * 2.0) * uFade);
            }`
    }));
    dust.frustumCulled = false;
    scene.add(dust);

    const V = (x, y, z) => new THREE_.Vector3(x, y, z);
    const posKeys = [
        V(34, 2.2, 30), V(24, 3.0, 28), V(6, 4.6, 30), V(-22, 6.0, 20), V(-27, 5.0, 0.4),
        V(-6, 5.6, 0.3), V(12, 8.8, 0.2), V(24, 10, 30), V(25, 10.4, 32)
    ];
    const tgtKeys = [
        V(0, 1.0, 0), V(0, 2.2, 0), V(0, 4.0, 0), V(-2, 6.0, 0), V(0, 5.5, 0.4),
        V(8, 7.2, 0.3), V(0, 9.0, 0), V(-16, 8.0, -4), V(-16.5, 8.2, -4.2)
    ];
    const posCurve = new THREE_.CatmullRomCurve3(posKeys, false, 'centripetal');
    const tgtCurve = new THREE_.CatmullRomCurve3(tgtKeys, false, 'centripetal');
    const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

    window.setTime = (t) => {
        uniforms.uTime.value = t;
        uniforms.uFade.value = smooth(0, 0.7, t) * (1 - smooth(DURATION - 1.0, DURATION - 0.1, t));
        uniforms.uScan.value = t < 11 ? -10 : -1.5 + (H + 4) * smooth(11, 14.2, t);
        const u = Math.min(0.9999, t / DURATION);
        camera.position.copy(posCurve.getPoint(u));
        const target = tgtCurve.getPoint(u);
        camera.up.set(Math.sin(t * 0.4) * 0.03, 1, 0);
        camera.lookAt(target);
        camera.fov = 38 + 16 * (smooth(7.2, 9.2, t) * (1 - smooth(11.2, 13.2, t)));
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        return true;
    };
    window.DURATION = DURATION;
    window.ready = true;
})();
</script>
</body>
</html>
